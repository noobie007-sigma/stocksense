<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>StockSense</h1>
    <p class="tagline">Understand any Indian stock in one glance</p>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search a company or ticker (e.g. TCS)" />
      <button id="search-button">Search</button>
    </div>

    <div id="results">
      <p class="idle-message">Search any major NSE stock to see a plain-English health check.</p>
    </div>
  </main>

  <footer class="site-footer">
    Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
  </footer>

  <script src="script.js"></script>
</body>
</html>
