<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Understand any Indian stock in one glance</title>
  <meta name="description" content="Search any major NSE-listed Indian stock and get a plain-English snapshot, ratio breakdown, and red-flag check — built for beginners, no jargon." />

  <meta property="og:title" content="StockSense — Understand any Indian stock in one glance" />
  <meta property="og:description" content="Search any major NSE-listed Indian stock and get a plain-English snapshot, ratio breakdown, and red-flag check — built for beginners, no jargon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://noobie007-sigma.github.io/stocksense/" />
  <meta property="og:image" content="https://noobie007-sigma.github.io/stocksense/assets/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StockSense — Understand any Indian stock in one glance" />
  <meta name="twitter:description" content="Search any major NSE-listed Indian stock and get a plain-English snapshot, ratio breakdown, and red-flag check." />
  <meta name="twitter:image" content="https://noobie007-sigma.github.io/stocksense/assets/og-image.png" />

  <link rel="canonical" href="https://noobie007-sigma.github.io/stocksense/" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23065A82'/%3E%3Cpath d='M20 65 L40 45 L55 58 L80 30' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <div class="logo-row">
      <div class="logo-mark" aria-hidden="true">📈</div>
      <h1>StockSense</h1>
    </div>
    <p class="tagline">Understand any Indian stock in one glance — no finance degree required</p>
  </header>

  <main id="main-content">
    <form class="search-bar" id="search-form" role="search">
      <label for="search-input" class="visually-hidden">Search a company or ticker</label>
      <input
        type="text"
        id="search-input"
        placeholder="Search a company or ticker (e.g. TCS)"
        autocomplete="off"
        aria-label="Search a company or ticker"
      />
      <button type="submit" id="search-button">Search</button>
    </form>

    <div class="quick-chips" id="quick-chips" aria-label="Example searches">
      <span class="quick-chips-label">Try:</span>
      <button type="button" class="chip" data-ticker="TCS">TCS</button>
      <button type="button" class="chip" data-ticker="RELIANCE">Reliance</button>
      <button type="button" class="chip" data-ticker="ZOMATO">Zomato</button>
      <button type="button" class="chip" data-ticker="COALINDIA">Coal India</button>
      <button type="button" class="chip" data-ticker="BAJFINANCE">Bajaj Finance</button>
    </div>

    <div id="results" aria-live="polite">
      <div class="idle-state">
        <p class="idle-message">Search any major NSE stock above — or tap an example — to see a plain-English health check, all on one screen.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
  </footer>

  <script src="script.js"></script>
</body>
</html>
